<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Logistics - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="index.html" class="flex items-center space-x-2">
          <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center"><span class="text-white font-bold text-lg">GL</span></div>
          <span class="text-xl font-bold text-slate-800">GLOBAL LOGISTICS</span>
        </a>
        <nav id="nav-links" class="hidden md:flex items-center space-x-6"></nav>
        <button onclick="toggleMobileMenu()" class="md:hidden text-slate-700"><i class="fas fa-bars text-2xl"></i></button>
      </div>
    </div>
    <div id="mobile-menu" class="hidden md:hidden bg-white border-t">
      <div id="mobile-nav-links" class="px-4 py-3 space-y-2"></div>
    </div>
  </header>

  <section class="py-16">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8">
      <div class="bg-white rounded-xl shadow-md p-8">
        <h1 class="text-3xl font-bold text-center mb-2">Welcome Back</h1>
        <p class="text-slate-500 text-center mb-8">Sign in to your Global Logistics account</p>
        <form id="login-form" class="space-y-4">
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Email</label><input type="email" id="login-email" required class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600"></div>
          <div><label class="block text-sm font-medium text-slate-700 mb-1">Password</label><input type="password" id="login-password" required class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600"></div>
          <div id="login-error" class="text-red-600 text-sm hidden"></div>
          <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition font-semibold">Sign In</button>
        </form>
        <div class="mt-6 text-center"><p class="text-slate-600">Don't have an account? <a href="signup.html" class="text-blue-600 font-medium hover:underline">Sign up</a></p></div>
      </div>
    </div>
  </section>

  <footer class="bg-slate-800 text-white py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <div class="flex items-center justify-center space-x-2 mb-4">
        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center"><span class="text-white font-bold text-sm">GL</span></div>
        <span class="text-lg font-bold">GLOBAL LOGISTICS</span>
      </div>
      <!-- Centered Returns & FAQ links - larger & responsive -->
<div class="flex flex-wrap justify-center gap-x-8 gap-y-3 text-base md:text-lg text-slate-300 mb-4">
  <a href="returns.html" class="hover:text-white transition duration-200 font-medium">Returns</a>
  <a href="faq.html" class="hover:text-white transition duration-200 font-medium">FAQ</a>
</div>
      <div class="text-slate-400 mb-4">
        <p><i class="fas fa-phone mr-2"></i> +1 (804) 670-9600</p>
        <p><i class="fas fa-envelope mr-2"></i> shippingsolutiong@gmail.com</p>
      </div>
      <div class="text-slate-500 text-sm">&copy; 2024 Global Logistics. All rights reserved.</div>
    </div>
  </footer>


<script src="https://chat.talktoagent.ai/chat-widget.js" data-widget-id="807f4a81-beff-419b-b05d-2cd3420d84fd"></script>
  <script src="/config.js"></script>
  <script src="/main.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) { errorDiv.textContent = error.message; errorDiv.classList.remove('hidden'); }
        else { window.location.href = 'index.html'; }
      } catch (err) { errorDiv.textContent = 'An unexpected error occurred. Please try again.'; errorDiv.classList.remove('hidden'); }
    });
  </script>
</body>
</html>
