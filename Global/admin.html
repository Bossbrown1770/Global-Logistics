<script>
  let editingId = null;

  // ----- Direct Supabase profile fetch (bypasses main.js) -----
  async function getCurrentUserAndProfile() {
    const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
    if (userError || !user) {
      window.location.href = 'login.html';
      return null;
    }
    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', user.id)
      .single();

    if (profileError || !profile) {
      // If no profile, create one (optional) or redirect
      console.warn('No profile found, creating default...');
      // You could insert a default profile here if needed
      window.location.href = 'login.html';
      return null;
    }

    if (profile.role !== 'admin') {
      alert('Admin access required.');
      window.location.href = 'index.html';
      return null;
    }

    // All good – return user and profile
    return { user, profile };
  }

  // ----- Initialize the admin dashboard -----
  async function initAdmin() {
    const result = await getCurrentUserAndProfile();
    if (!result) return; // already redirected

    // Optionally display the user's email as a welcome
    const welcomeEl = document.createElement('div');
    welcomeEl.className = 'bg-blue-50 p-4 rounded-lg mb-6';
    welcomeEl.innerHTML = `<span class="font-semibold">Logged in as:</span> ${result.user.email} (${result.profile.role})`;
    document.querySelector('.max-w-7xl > h1').after(welcomeEl);

    // Now load data
    loadTrackingCodes();
    loadUsers();
  }

  // Call the init
  initAdmin();

  // ----- The rest of your functions (unchanged, except we use supabaseClient) -----
  function generateTrackingId() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let result = 'GL-';
    for (let i = 0; i < 6; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
    document.getElementById('tracking-id').value = result;
  }

  document.getElementById('tracking-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorDiv = document.getElementById('form-error');
    const successDiv = document.getElementById('form-success');
    errorDiv.classList.add('hidden'); successDiv.classList.add('hidden');
    const data = {
      tracking_id: document.getElementById('tracking-id').value.trim(),
      origin: document.getElementById('origin').value.trim(),
      destination: document.getElementById('destination').value.trim(),
      status: document.getElementById('status').value,
      origin_lat: parseFloat(document.getElementById('origin-lat').value),
      origin_lng: parseFloat(document.getElementById('origin-lng').value),
      dest_lat: parseFloat(document.getElementById('dest-lat').value),
      dest_lng: parseFloat(document.getElementById('dest-lng').value),
      duration_hours: parseInt(document.getElementById('duration').value),
      estimated_delivery: document.getElementById('est-delivery').value || null,
      customer_email: document.getElementById('customer-email').value.trim() || null
    };
    try {
      let result;
      if (editingId) { result = await supabaseClient.from('tracking').update(data).eq('id', editingId); }
      else { result = await supabaseClient.from('tracking').insert([data]); }
      if (result.error) { errorDiv.textContent = result.error.message; errorDiv.classList.remove('hidden'); }
      else { successDiv.textContent = editingId ? 'Tracking code updated successfully!' : 'Tracking code created successfully!'; successDiv.classList.remove('hidden'); resetForm(); loadTrackingCodes(); }
    } catch (err) { errorDiv.textContent = 'An error occurred. Please try again.'; errorDiv.classList.remove('hidden'); }
  });

  function resetForm() {
    editingId = null;
    document.getElementById('tracking-form').reset();
    document.getElementById('form-title').textContent = 'Create Tracking Code';
    document.getElementById('submit-btn').textContent = 'Create';
    document.getElementById('form-error').classList.add('hidden');
    document.getElementById('form-success').classList.add('hidden');
  }

  async function loadTrackingCodes() {
    const tbody = document.getElementById('tracking-table-body');
    try {
      const { data, error } = await supabaseClient.from('tracking').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-500">No tracking codes found.</td></tr>'; return; }
      tbody.innerHTML = data.map(item => {
        let statusClass = 'bg-yellow-100 text-yellow-800';
        if (item.status === 'In Transit') statusClass = 'bg-blue-100 text-blue-800';
        if (item.status === 'Delivered') statusClass = 'bg-green-100 text-green-800';
        if (item.status === 'Exception') statusClass = 'bg-red-100 text-red-800';
        return `<tr class="hover:bg-slate-50">
          <td class="px-4 py-3 font-mono text-sm">${item.tracking_id}</td>
          <td class="px-4 py-3">${item.origin}</td>
          <td class="px-4 py-3">${item.destination}</td>
          <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-medium ${statusClass}">${item.status}</span></td>
          <td class="px-4 py-3">${item.estimated_delivery || 'N/A'}</td>
          <td class="px-4 py-3">
            <button onclick="editTracking('${item.id}')" class="text-blue-600 hover:text-blue-800 mr-3"><i class="fas fa-edit"></i></button>
            <button onclick="deleteTracking('${item.id}')" class="text-red-600 hover:text-red-800"><i class="fas fa-trash"></i></button>
          </td>
        </tr>`;
      }).join('');
    } catch (err) { tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-red-500">Error loading data.</td></tr>'; }
  }

  async function editTracking(id) {
    try {
      const { data, error } = await supabaseClient.from('tracking').select('*').eq('id', id).single();
      if (error || !data) return;
      editingId = id;
      document.getElementById('tracking-id').value = data.tracking_id;
      document.getElementById('origin').value = data.origin;
      document.getElementById('destination').value = data.destination;
      document.getElementById('status').value = data.status;
      document.getElementById('origin-lat').value = data.origin_lat;
      document.getElementById('origin-lng').value = data.origin_lng;
      document.getElementById('dest-lat').value = data.dest_lat;
      document.getElementById('dest-lng').value = data.dest_lng;
      document.getElementById('duration').value = data.duration_hours;
      document.getElementById('est-delivery').value = data.estimated_delivery || '';
      document.getElementById('customer-email').value = data.customer_email || '';
      document.getElementById('form-title').textContent = 'Edit Tracking Code';
      document.getElementById('submit-btn').textContent = 'Update';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {}
  }

  async function deleteTracking(id) {
    if (!confirm('Are you sure you want to delete this tracking code?')) return;
    try { const { error } = await supabaseClient.from('tracking').delete().eq('id', id); if (!error) loadTrackingCodes(); } catch (err) {}
  }

  async function loadUsers() {
    const tbody = document.getElementById('users-table-body');
    try {
      const { data, error } = await supabaseClient.from('profiles').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-8 text-center text-slate-500">No users found.</td></tr>'; return; }
      tbody.innerHTML = data.map(user => {
        const isAdmin = user.role === 'admin';
        const roleClass = isAdmin ? 'bg-purple-100 text-purple-800' : 'bg-slate-100 text-slate-800';
        return `<tr class="hover:bg-slate-50">
          <td class="px-4 py-3">${user.email}</td>
          <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-medium ${roleClass}">${user.role}</span></td>
          <td class="px-4 py-3 text-sm text-slate-500">${new Date(user.created_at).toLocaleDateString()}</td>
          <td class="px-4 py-3">${!isAdmin ? `<button onclick="promoteUser('${user.id}')" class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700 transition">Make Admin</button>` : '<span class="text-slate-400 text-sm">Admin</span>'}</td>
        </tr>`;
      }).join('');
    } catch (err) { tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-8 text-center text-red-500">Error loading users.</td></tr>'; }
  }

  async function promoteUser(id) {
    if (!confirm('Promote this user to admin?')) return;
    try { const { error } = await supabaseClient.from('profiles').update({ role: 'admin' }).eq('id', id); if (!error) loadUsers(); } catch (err) {}
  }
</script>
